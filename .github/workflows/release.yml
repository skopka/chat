name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Validate release packages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      release_version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Determine version from tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PRERELEASE_IDENTIFIER='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER_PATTERN="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${PRERELEASE_IDENTIFIER}(\.${PRERELEASE_IDENTIFIER})*)?$"
          if [[ ! "$VERSION" =~ $SEMVER_PATTERN ]]; then
            echo "Release tag must be v followed by SemVer without build metadata." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Skopka.Chat.sln --configfile NuGet.Config

      - name: Verify declared release line
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          DECLARED_VERSION=$(dotnet msbuild src/Skopka.Chat.Protocol/Skopka.Chat.Protocol.csproj -getProperty:VersionPrefix -nologo)
          RELEASE_BASE_VERSION="${RELEASE_VERSION%%-*}"
          if [[ "$DECLARED_VERSION" != "$RELEASE_BASE_VERSION" ]]; then
            echo "Tag base version '$RELEASE_BASE_VERSION' does not match VersionPrefix '$DECLARED_VERSION'." >&2
            exit 1
          fi

      - name: Verify formatting
        run: dotnet format Skopka.Chat.sln --no-restore --verify-no-changes

      - name: Build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet build Skopka.Chat.sln
          --configuration Release
          --no-restore
          -p:Version="$RELEASE_VERSION"
          -p:PackageVersion="$RELEASE_VERSION"

      - name: Run unit and infrastructure-free integration tests
        run: dotnet test --solution Skopka.Chat.sln --configuration Release --no-build --no-restore

      - name: Require PostgreSQL reliability integration
        run: dotnet test --project tests/Skopka.Chat.Persistence.PostgreSql.Tests --configuration Release --no-build --no-restore
        env: &postgres-test-environment
          SKOPKA_CHAT_POSTGRES_REQUIRED: true
          SKOPKA_CHAT_POSTGRES_TESTCONTAINERS: true

      - name: Require PostgreSQL attachment integration
        run: dotnet test --project tests/Skopka.Chat.Attachments.Tests --configuration Release --no-build --no-restore
        env: *postgres-test-environment

      - name: Require authenticated HTTP to PostgreSQL E2EE integration
        run: dotnet test --project tests/Skopka.Chat.Http.IntegrationTests --configuration Release --no-build --no-restore
        env: *postgres-test-environment

      - name: Require device binding PostgreSQL restart and transaction gate
        run: dotnet test --project tests/Skopka.Chat.Binding.Tests --configuration Release --no-build --no-restore
        env: *postgres-test-environment

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install --yes afl++

      - name: Run coverage-guided JSON and content fuzz smoke
        run: bash eng/run-json-fuzz-smoke.sh 15 "${{ github.workspace }}/artifacts/fuzz-release"

      - name: Audit NuGet dependencies
        run: dotnet list Skopka.Chat.Core.slnf package --vulnerable --include-transitive --no-restore

      - name: Verify owner-hosted bot gateway Linux container
        run: docker build --target checks -f samples/Skopka.Chat.BotGateway/Dockerfile -t skopka-chat-bot-checks:release-check .

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet pack Skopka.Chat.sln
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:Version="$RELEASE_VERSION"
          -p:PackageVersion="$RELEASE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Verify core package set
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          PACKAGE_IDS=(
            "Skopka.Chat.Protocol"
            "Skopka.Chat.Attachments"
            "Skopka.Chat.Attachments.PostgreSql"
            "Skopka.Chat.Attachments.S3"
            "Skopka.Chat.Client"
            "Skopka.Chat.Client.Browser"
            "Skopka.Chat.Client.Storage"
            "Skopka.Chat.Client.Storage.Sqlite"
            "Skopka.Chat.Media"
            "Skopka.Chat.Media.FFmpeg"
            "Skopka.Chat.UI.Core"
            "Skopka.Chat.UI.Blazor"
            "Skopka.Chat.Transport.Http"
            "Skopka.Chat.Client.Http"
            "Skopka.Chat.Server"
            "Skopka.Chat.Server.NSec"
            "Skopka.Chat.Bots"
            "Skopka.Chat.Bots.Sqlite"
            "Skopka.Chat.Bots.AspNetCore"
            "Skopka.Chat.Server.AspNetCore"
            "Skopka.Chat.Persistence.PostgreSql"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            for EXTENSION in nupkg snupkg; do
              PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${RELEASE_VERSION}.${EXTENSION}"
              if [[ ! -f "$PACKAGE_PATH" ]]; then
                echo "Expected package '$PACKAGE_PATH' was not produced." >&2
                exit 1
              fi
            done
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${RELEASE_VERSION}.nupkg" | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${RELEASE_VERSION}.snupkg" | wc -l)
          if [[ "$NUPKG_COUNT" -ne 21 || "$SNUPKG_COUNT" -ne 21 ]]; then
            echo "Expected 21 packages and 21 symbol packages, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Restore package consumer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet restore tests/Skopka.Chat.PackageConsumer/Skopka.Chat.PackageConsumer.csproj
          --configfile NuGet.Config
          -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/packages"
          -p:ChatPackageVersion="$RELEASE_VERSION"

      - name: Run package consumer
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: >
          dotnet run
          --project tests/Skopka.Chat.PackageConsumer/Skopka.Chat.PackageConsumer.csproj
          --configuration Release
          --no-restore
          -p:ChatPackageVersion="$RELEASE_VERSION"


      - name: Set up browser test runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'

      - name: Install pinned browser test dependencies
        run: |
          npx --yes pnpm@11.19.0 --dir eng/browser install --frozen-lockfile --ignore-scripts
          node eng/browser/node_modules/playwright/cli.js install --with-deps chromium firefox

      - name: Require published browser package, native interop, storage and cookie BFF gates
        env:
          CHAT_BROWSER_PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: node eng/browser/run-gate.mjs

      - name: Upload core release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-core-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  validate-maui:
    name: Validate MAUI release packages
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Locate Visual Studio Appx build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $appxTools = Get-ChildItem "$installation\MSBuild\Microsoft\VisualStudio" -Filter Microsoft.Build.AppxPackage.dll -Recurse |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $appxTools) { throw 'Visual Studio Appx build tools were not found.' }
          "AppxMSBuildToolsPath=$appxTools\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore MAUI workloads
        run: dotnet workload restore samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj

      - name: Restore MAUI release projects
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore tests/Skopka.Chat.Client.Maui.Tests/Skopka.Chat.Client.Maui.Tests.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore tests/Skopka.Chat.UI.Maui.Tests/Skopka.Chat.UI.Maui.Tests.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --configfile NuGet.Config -p:Configuration=Release

      - name: Audit MAUI NuGet dependencies
        shell: pwsh
        run: |
          $projects = @(
            'src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj',
            'src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj',
            'tests/Skopka.Chat.Client.Maui.Tests/Skopka.Chat.Client.Maui.Tests.csproj',
            'tests/Skopka.Chat.UI.Maui.Tests/Skopka.Chat.UI.Maui.Tests.csproj',
            'samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj'
          )
          foreach ($project in $projects) {
            dotnet list $project package --vulnerable --include-transitive --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and test MAUI release projects
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # Keep multi-TFM XAML source generation serial to avoid nondeterministic compiler collisions.
          dotnet build src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false -p:Version="$env:RELEASE_VERSION" -p:PackageVersion="$env:RELEASE_VERSION"
          dotnet build src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false -p:Version="$env:RELEASE_VERSION" -p:PackageVersion="$env:RELEASE_VERSION"
          dotnet test --project tests/Skopka.Chat.Client.Maui.Tests/Skopka.Chat.Client.Maui.Tests.csproj --configuration Release
          dotnet test --project tests/Skopka.Chat.UI.Maui.Tests/Skopka.Chat.UI.Maui.Tests.csproj --configuration Release
          dotnet build samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-android --configuration Release
          dotnet build samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-windows10.0.19041.0 --configuration Release -p:Platform=x64
          dotnet publish samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-android --configuration Release -p:RuntimeIdentifier=android-arm64 -p:PublishTrimmed=true -p:RunAOTCompilation=true

      - name: Pack MAUI release projects
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet pack src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj --configuration Release --no-build --no-restore --output artifacts/packages -p:Version="$env:RELEASE_VERSION" -p:PackageVersion="$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj --configuration Release --no-build --no-restore --output artifacts/packages -p:Version="$env:RELEASE_VERSION" -p:PackageVersion="$env:RELEASE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Download core packages for the MAUI consumer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-core-packages
          path: artifacts/packages

      - name: Verify MAUI package assets and consumer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $frameworks = @('net10.0-android', 'net10.0-ios', 'net10.0-maccatalyst', 'net10.0-windows10.0.19041')
          foreach ($packageId in @('Skopka.Chat.Client.Maui', 'Skopka.Chat.UI.Maui')) {
            foreach ($extension in @('nupkg', 'snupkg')) {
              $path = "artifacts/packages/$packageId.$env:RELEASE_VERSION.$extension"
              if (-not (Test-Path -LiteralPath $path)) { throw "Expected package '$path' was not produced." }
            }
            $archive = [IO.Compression.ZipFile]::OpenRead("artifacts/packages/$packageId.$env:RELEASE_VERSION.nupkg")
            try {
              foreach ($framework in $frameworks) {
                $frameworkPattern = [regex]::Escape($framework)
                if (-not ($archive.Entries.FullName -match "^lib/$frameworkPattern[^/]*/[^/]+\.dll$")) {
                  throw "$packageId is missing a compiled $framework asset."
                }
              }
            }
            finally { $archive.Dispose() }
          }
          dotnet restore tests/Skopka.Chat.Maui.PackageConsumer/Skopka.Chat.Maui.PackageConsumer.csproj --configfile NuGet.Config -p:RestoreAdditionalProjectSources="$env:GITHUB_WORKSPACE/artifacts/packages" -p:ChatPackageVersion="$env:RELEASE_VERSION"
          dotnet build tests/Skopka.Chat.Maui.PackageConsumer/Skopka.Chat.Maui.PackageConsumer.csproj --configuration Release --no-restore -p:ChatPackageVersion="$env:RELEASE_VERSION"

      - name: Upload MAUI release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-maui-packages
          path: |
            artifacts/packages/Skopka.Chat.Client.Maui.*nupkg
            artifacts/packages/Skopka.Chat.UI.Maui.*nupkg
          if-no-files-found: error
          retention-days: 30

  validate-maui-apple:
    name: Validate MAUI iOS and Mac Catalyst release builds
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore MAUI workloads
        run: dotnet workload restore samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj

      - name: Build iOS and Mac Catalyst sample and run trimming smoke
        run: bash eng/run-maui-apple-gates.sh

  combine-packages:
    name: Verify coordinated release set
    needs:
      - validate
      - validate-maui
      - validate-maui-apple
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download core release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-core-packages
          path: artifacts/packages

      - name: Download MAUI release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-maui-packages
          path: artifacts/packages

      - name: Verify exact coordinated set
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          PACKAGE_IDS=(
            "Skopka.Chat.Protocol"
            "Skopka.Chat.Attachments"
            "Skopka.Chat.Attachments.PostgreSql"
            "Skopka.Chat.Attachments.S3"
            "Skopka.Chat.Client"
            "Skopka.Chat.Client.Browser"
            "Skopka.Chat.Client.Storage"
            "Skopka.Chat.Client.Storage.Sqlite"
            "Skopka.Chat.Client.Maui"
            "Skopka.Chat.Media"
            "Skopka.Chat.Media.FFmpeg"
            "Skopka.Chat.UI.Core"
            "Skopka.Chat.UI.Blazor"
            "Skopka.Chat.UI.Maui"
            "Skopka.Chat.Server"
            "Skopka.Chat.Server.NSec"
            "Skopka.Chat.Bots"
            "Skopka.Chat.Bots.Sqlite"
            "Skopka.Chat.Bots.AspNetCore"
            "Skopka.Chat.Transport.Http"
            "Skopka.Chat.Client.Http"
            "Skopka.Chat.Persistence.PostgreSql"
            "Skopka.Chat.Server.AspNetCore"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            test -f "artifacts/packages/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg"
            test -f "artifacts/packages/${PACKAGE_ID}.${RELEASE_VERSION}.snupkg"
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${RELEASE_VERSION}.nupkg" | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${RELEASE_VERSION}.snupkg" | wc -l)
          if [[ "$NUPKG_COUNT" -ne 23 || "$SNUPKG_COUNT" -ne 23 ]]; then
            echo "Expected 23 packages and 23 symbol packages, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Upload coordinated release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: Publish coordinated NuGet set
    needs:
      - validate
      - combine-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-packages
          path: artifacts/packages

      - name: Require a completely unpublished version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          VERSION_LOWER="${RELEASE_VERSION,,}"
          PACKAGE_IDS=(
            "skopka.chat.protocol"
            "skopka.chat.attachments"
            "skopka.chat.attachments.postgresql"
            "skopka.chat.attachments.s3"
            "skopka.chat.client"
            "skopka.chat.client.browser"
            "skopka.chat.client.storage"
            "skopka.chat.client.storage.sqlite"
            "skopka.chat.client.maui"
            "skopka.chat.media"
            "skopka.chat.media.ffmpeg"
            "skopka.chat.ui.core"
            "skopka.chat.ui.blazor"
            "skopka.chat.ui.maui"
            "skopka.chat.transport.http"
            "skopka.chat.client.http"
            "skopka.chat.server"
            "skopka.chat.server.nsec"
            "skopka.chat.bots"
            "skopka.chat.bots.sqlite"
            "skopka.chat.bots.aspnetcore"
            "skopka.chat.server.aspnetcore"
            "skopka.chat.persistence.postgresql"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION_LOWER}/${PACKAGE_ID}.${VERSION_LOWER}.nupkg"
            STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "$PACKAGE_URL")
            if [[ "$STATUS" == "200" ]]; then
              echo "Package ${PACKAGE_ID} ${RELEASE_VERSION} already exists; release artifacts are immutable." >&2
              exit 1
            fi
            if [[ "$STATUS" != "404" ]]; then
              echo "Could not prove ${PACKAGE_ID} ${RELEASE_VERSION} is unpublished; NuGet.org returned HTTP ${STATUS}." >&2
              exit 1
            fi
          done

      - name: Push every package to NuGet.org
        id: nuget_push
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          PACKAGE_IDS=(
            "Skopka.Chat.Protocol"
            "Skopka.Chat.Attachments"
            "Skopka.Chat.Attachments.PostgreSql"
            "Skopka.Chat.Attachments.S3"
            "Skopka.Chat.Client"
            "Skopka.Chat.Client.Storage"
            "Skopka.Chat.Client.Storage.Sqlite"
            "Skopka.Chat.Media"
            "Skopka.Chat.Media.FFmpeg"
            "Skopka.Chat.Client.Maui"
            "Skopka.Chat.UI.Core"
            "Skopka.Chat.UI.Blazor"
            "Skopka.Chat.UI.Maui"
            "Skopka.Chat.Server"
            "Skopka.Chat.Server.NSec"
            "Skopka.Chat.Bots"
            "Skopka.Chat.Bots.Sqlite"
            "Skopka.Chat.Bots.AspNetCore"
            "Skopka.Chat.Transport.Http"
            "Skopka.Chat.Client.Http"
            "Skopka.Chat.Client.Browser"
            "Skopka.Chat.Persistence.PostgreSql"
            "Skopka.Chat.Server.AspNetCore"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            dotnet nuget push "artifacts/packages/${PACKAGE_ID}.${RELEASE_VERSION}.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source "https://api.nuget.org/v3/index.json"
          done

      - name: Wait until every package is available on NuGet.org
        if: ${{ always() }}
        shell: bash
        env:
          PUSH_OUTCOME: ${{ steps.nuget_push.outcome }}
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
        run: |
          VERSION_LOWER="${RELEASE_VERSION,,}"
          PACKAGE_IDS=(
            "skopka.chat.protocol"
            "skopka.chat.attachments"
            "skopka.chat.attachments.postgresql"
            "skopka.chat.attachments.s3"
            "skopka.chat.client"
            "skopka.chat.client.browser"
            "skopka.chat.client.storage"
            "skopka.chat.client.storage.sqlite"
            "skopka.chat.client.maui"
            "skopka.chat.media"
            "skopka.chat.media.ffmpeg"
            "skopka.chat.ui.core"
            "skopka.chat.ui.blazor"
            "skopka.chat.ui.maui"
            "skopka.chat.transport.http"
            "skopka.chat.client.http"
            "skopka.chat.server"
            "skopka.chat.server.nsec"
            "skopka.chat.bots"
            "skopka.chat.bots.sqlite"
            "skopka.chat.bots.aspnetcore"
            "skopka.chat.server.aspnetcore"
            "skopka.chat.persistence.postgresql"
          )

          for ATTEMPT in {1..60}; do
            MISSING=()
            for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
              PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID}/${VERSION_LOWER}/${PACKAGE_ID}.${VERSION_LOWER}.nupkg"
              if ! curl --fail --silent --show-error --head "$PACKAGE_URL" > /dev/null; then
                MISSING+=("$PACKAGE_ID")
              fi
            done

            if [[ "${#MISSING[@]}" -eq 0 ]]; then
              if [[ "$PUSH_OUTCOME" != "success" ]]; then
                echo "All packages are visible, but NuGet push reported a failure; symbol publication is not proven. Do not reuse this version." >&2
                exit 1
              fi
              echo "All packages are available on NuGet.org."
              exit 0
            fi

            echo "Attempt ${ATTEMPT}: waiting for ${MISSING[*]}"
            sleep 10
          done

          echo "The version was only partially published. Do not reuse it; fix the cause and release a new patch version." >&2
          exit 1

  publish-release:
    name: Publish GitHub release
    needs:
      - validate
      - publish-nuget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-packages
          path: artifacts/packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.1
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.validate.outputs.release_version, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
