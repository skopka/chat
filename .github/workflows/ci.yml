name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Core build, test, fuzz, and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      package_version: ${{ steps.package_version.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Skopka.Chat.sln --configfile NuGet.Config

      - name: Build
        run: dotnet build Skopka.Chat.sln --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format Skopka.Chat.sln --no-restore --verify-no-changes

      - name: Run unit, hostile-input, and infrastructure-free integration tests
        run: dotnet test --solution Skopka.Chat.sln --configuration Release --no-build --no-restore

      - name: Require PostgreSQL reliability integration
        run: dotnet test --project tests/Skopka.Chat.Persistence.PostgreSql.Tests --configuration Release --no-build --no-restore
        env: &postgres-test-environment
          SKOPKA_CHAT_POSTGRES_REQUIRED: true
          SKOPKA_CHAT_POSTGRES_TESTCONTAINERS: true

      - name: Require PostgreSQL attachment integration
        run: dotnet test --project tests/Skopka.Chat.Attachments.Tests --configuration Release --no-build --no-restore
        env: *postgres-test-environment

      - name: Require authenticated HTTP to PostgreSQL E2EE integration
        run: dotnet test --project tests/Skopka.Chat.Http.IntegrationTests --configuration Release --no-build --no-restore
        env: *postgres-test-environment

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install --yes afl++

      - name: Run coverage-guided JSON and content fuzz smoke
        run: bash eng/run-json-fuzz-smoke.sh 10 "${{ github.workspace }}/artifacts/fuzz-smoke"

      - name: Audit NuGet dependencies
        run: dotnet list Skopka.Chat.Core.slnf package --vulnerable --include-transitive --no-restore

      - name: Determine package version
        id: package_version
        shell: bash
        run: |
          VERSION="$(dotnet msbuild src/Skopka.Chat.Protocol/Skopka.Chat.Protocol.csproj -getProperty:PackageVersion -nologo)"
          if [[ -z "$VERSION" ]]; then
            echo "The package version could not be determined." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: dotnet pack Skopka.Chat.sln --configuration Release --no-build --no-restore --property:ContinuousIntegrationBuild=true

      - name: Verify core package set
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: |
          PACKAGE_IDS=(
            "Skopka.Chat.Protocol"
            "Skopka.Chat.Attachments"
            "Skopka.Chat.Attachments.PostgreSql"
            "Skopka.Chat.Attachments.S3"
            "Skopka.Chat.Client"
            "Skopka.Chat.Client.Storage"
            "Skopka.Chat.Client.Storage.Sqlite"
            "Skopka.Chat.Media"
            "Skopka.Chat.Media.FFmpeg"
            "Skopka.Chat.UI.Core"
            "Skopka.Chat.UI.Blazor"
            "Skopka.Chat.Transport.Http"
            "Skopka.Chat.Client.Http"
            "Skopka.Chat.Server"
            "Skopka.Chat.Server.AspNetCore"
            "Skopka.Chat.Persistence.PostgreSql"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            for EXTENSION in nupkg snupkg; do
              PACKAGE_PATH="artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.${EXTENSION}"
              if [[ ! -f "$PACKAGE_PATH" ]]; then
                echo "Expected package '$PACKAGE_PATH' was not produced." >&2
                exit 1
              fi
            done
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${PACKAGE_VERSION}.nupkg" | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${PACKAGE_VERSION}.snupkg" | wc -l)
          if [[ "$NUPKG_COUNT" -ne 16 || "$SNUPKG_COUNT" -ne 16 ]]; then
            echo "Expected 16 packages and 16 symbol packages for ${PACKAGE_VERSION}, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Restore package consumer
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          dotnet restore tests/Skopka.Chat.PackageConsumer/Skopka.Chat.PackageConsumer.csproj
          --configfile NuGet.Config
          -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/packages"
          -p:ChatPackageVersion="$PACKAGE_VERSION"

      - name: Run package consumer
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.value }}
        run: >
          dotnet run
          --project tests/Skopka.Chat.PackageConsumer/Skopka.Chat.PackageConsumer.csproj
          --configuration Release
          --no-restore
          -p:ChatPackageVersion="$PACKAGE_VERSION"

      - name: Upload core NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skopka-chat-core-nuget-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  maui-windows:
    name: MAUI Android and Windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Locate Visual Studio Appx build tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $appxTools = Get-ChildItem "$installation\MSBuild\Microsoft\VisualStudio" -Filter Microsoft.Build.AppxPackage.dll -Recurse |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $appxTools) { throw 'Visual Studio Appx build tools were not found.' }
          "AppxMSBuildToolsPath=$appxTools\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore MAUI workloads
        run: dotnet workload restore samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj

      - name: Restore MAUI projects
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore tests/Skopka.Chat.Client.Maui.Tests/Skopka.Chat.Client.Maui.Tests.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore tests/Skopka.Chat.UI.Maui.Tests/Skopka.Chat.UI.Maui.Tests.csproj --configfile NuGet.Config -p:Configuration=Release
          dotnet restore samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --configfile NuGet.Config -p:Configuration=Release

      - name: Audit MAUI NuGet dependencies
        shell: pwsh
        run: |
          $projects = @(
            'src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj',
            'src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj',
            'tests/Skopka.Chat.Client.Maui.Tests/Skopka.Chat.Client.Maui.Tests.csproj',
            'tests/Skopka.Chat.UI.Maui.Tests/Skopka.Chat.UI.Maui.Tests.csproj',
            'samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj'
          )
          foreach ($project in $projects) {
            dotnet list $project package --vulnerable --include-transitive --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build MAUI libraries
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj --configuration Release --no-restore
          dotnet build src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj --configuration Release --no-restore

      - name: Run MAUI adapter and control tests
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test --project tests/Skopka.Chat.Client.Maui.Tests/Skopka.Chat.Client.Maui.Tests.csproj --configuration Release
          dotnet test --project tests/Skopka.Chat.UI.Maui.Tests/Skopka.Chat.UI.Maui.Tests.csproj --configuration Release

      - name: Build MAUI sample for Android and Windows
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-android --configuration Release
          dotnet build samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-windows10.0.19041.0 --configuration Release -p:Platform=x64

      - name: Run trimmed Android AOT smoke build
        run: dotnet publish samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-android --configuration Release -p:RuntimeIdentifier=android-arm64 -p:PublishTrimmed=true -p:RunAOTCompilation=true

      - name: Pack MAUI packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet pack src/Skopka.Chat.Client.Maui/Skopka.Chat.Client.Maui.csproj --configuration Release --no-build --no-restore --output artifacts/packages -p:Version="$env:PACKAGE_VERSION" -p:PackageVersion="$env:PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true
          dotnet pack src/Skopka.Chat.UI.Maui/Skopka.Chat.UI.Maui.csproj --configuration Release --no-build --no-restore --output artifacts/packages -p:Version="$env:PACKAGE_VERSION" -p:PackageVersion="$env:PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true

      - name: Verify MAUI package assets
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $frameworks = @('net10.0-android', 'net10.0-ios', 'net10.0-maccatalyst', 'net10.0-windows10.0.19041')
          $packageIds = @('Skopka.Chat.Client.Maui', 'Skopka.Chat.UI.Maui')
          foreach ($packageId in $packageIds) {
            foreach ($extension in @('nupkg', 'snupkg')) {
              $path = "artifacts/packages/$packageId.$env:PACKAGE_VERSION.$extension"
              if (-not (Test-Path -LiteralPath $path)) { throw "Expected package '$path' was not produced." }
            }
            $archive = [IO.Compression.ZipFile]::OpenRead("artifacts/packages/$packageId.$env:PACKAGE_VERSION.nupkg")
            try {
              foreach ($framework in $frameworks) {
                $frameworkPattern = [regex]::Escape($framework)
                if (-not ($archive.Entries.FullName -match "^lib/$frameworkPattern[^/]*/[^/]+\.dll$")) {
                  throw "$packageId is missing a compiled $framework asset."
                }
              }
            }
            finally { $archive.Dispose() }
          }

      - name: Download core packages for the MAUI consumer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skopka-chat-core-nuget-${{ github.sha }}
          path: artifacts/packages

      - name: Restore and build Android package consumer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore tests/Skopka.Chat.Maui.PackageConsumer/Skopka.Chat.Maui.PackageConsumer.csproj --configfile NuGet.Config -p:RestoreAdditionalProjectSources="$env:GITHUB_WORKSPACE/artifacts/packages" -p:ChatPackageVersion="$env:PACKAGE_VERSION"
          dotnet build tests/Skopka.Chat.Maui.PackageConsumer/Skopka.Chat.Maui.PackageConsumer.csproj --configuration Release --no-restore -p:ChatPackageVersion="$env:PACKAGE_VERSION"

      - name: Upload MAUI NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skopka-chat-maui-nuget-${{ github.sha }}
          path: |
            artifacts/packages/Skopka.Chat.Client.Maui.*nupkg
            artifacts/packages/Skopka.Chat.UI.Maui.*nupkg
          if-no-files-found: error
          retention-days: 14

  maui-apple:
    name: MAUI iOS and Mac Catalyst
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore MAUI workloads
        run: dotnet workload restore samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj

      - name: Build iOS and Mac Catalyst sample
        run: |
          dotnet build samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-ios --configuration Release -p:RuntimeIdentifier=iossimulator-x64
          dotnet build samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-maccatalyst --configuration Release -p:RuntimeIdentifier=maccatalyst-x64

      - name: Run trimmed Mac Catalyst smoke build
        run: dotnet publish samples/Skopka.Chat.Maui.Sample/Skopka.Chat.Maui.Sample.csproj --framework net10.0-maccatalyst --configuration Release --no-restore -p:RuntimeIdentifier=maccatalyst-x64 -p:PublishTrimmed=true -p:RunAOTCompilation=false

  package-set:
    name: Verify coordinated package set
    needs:
      - validate
      - maui-windows
      - maui-apple
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download core packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skopka-chat-core-nuget-${{ github.sha }}
          path: artifacts/packages

      - name: Download MAUI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: skopka-chat-maui-nuget-${{ github.sha }}
          path: artifacts/packages

      - name: Verify exact coordinated set
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          PACKAGE_IDS=(
            "Skopka.Chat.Protocol"
            "Skopka.Chat.Attachments"
            "Skopka.Chat.Attachments.PostgreSql"
            "Skopka.Chat.Attachments.S3"
            "Skopka.Chat.Client"
            "Skopka.Chat.Client.Storage"
            "Skopka.Chat.Client.Storage.Sqlite"
            "Skopka.Chat.Client.Maui"
            "Skopka.Chat.Media"
            "Skopka.Chat.Media.FFmpeg"
            "Skopka.Chat.UI.Core"
            "Skopka.Chat.UI.Blazor"
            "Skopka.Chat.UI.Maui"
            "Skopka.Chat.Transport.Http"
            "Skopka.Chat.Client.Http"
            "Skopka.Chat.Server"
            "Skopka.Chat.Server.AspNetCore"
            "Skopka.Chat.Persistence.PostgreSql"
          )

          for PACKAGE_ID in "${PACKAGE_IDS[@]}"; do
            test -f "artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.nupkg"
            test -f "artifacts/packages/${PACKAGE_ID}.${PACKAGE_VERSION}.snupkg"
          done

          NUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${PACKAGE_VERSION}.nupkg" | wc -l)
          SNUPKG_COUNT=$(find artifacts/packages -maxdepth 1 -type f -name "*.${PACKAGE_VERSION}.snupkg" | wc -l)
          if [[ "$NUPKG_COUNT" -ne 18 || "$SNUPKG_COUNT" -ne 18 ]]; then
            echo "Expected 18 packages and 18 symbol packages, found $NUPKG_COUNT and $SNUPKG_COUNT." >&2
            exit 1
          fi

      - name: Upload coordinated NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skopka-chat-nuget-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14
